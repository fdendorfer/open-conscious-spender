name: Build dataset bundle

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build-dataset.mjs'
      - 'scripts/validate-dataset.mjs'
      - '!data/dist/**'

permissions:
  contents: write

# The job commits and pushes. Two merges in quick succession would otherwise
# race on the same ref; queue them instead of cancelling a half-done push.
concurrency:
  group: build-dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate dataset
        run: node scripts/validate-dataset.mjs

      - run: node scripts/build-dataset.mjs

      - name: Commit updated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dist
          git diff --cached --quiet && echo "No dataset changes" && exit 0
          git commit -m "chore: rebuild dataset bundle [skip ci]"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
