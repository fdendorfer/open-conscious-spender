name: Validate dataset

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate-dataset.mjs'
      - '!data/dist/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/validate-dataset.mjs
